defaults:
  - grpo_schema
  - _self_

beta: 0.005
loss_type: dapo
num_generations: 8
# Left at 8 (1 prompt/step), NOT doubled to 16: tried 16 on the 4090 rig and
# it OOM'd at step 0's backward pass (entropy_from_logits over the full-vocab
# logits tensor -- not generation, the loss computation itself). Rather than
# risk zero-variance steps *and* tight memory, dynamic sampling
# (max_resample_attempts below) is now the primary fix for the single-prompt
# zero-gradient problem from runs/2026-09-19_23-22-12 -- and it already fired
# correctly against this exact degenerate case in that same crashed run's log
# before the OOM hit (3 generate-and-score calls logged at step 0). Revisit
# raising this once there's more margin (e.g. shorter max_completion_length,
# or confirming entropy_coef isn't itself adding meaningful memory overhead).
# NOTE (post runs/2026-09-21_16-34-13): confirmed in trl 1.13.0 source that
# `entropy_from_logits` is gated on `entropy_coef != 0.0 or use_adaptive_entropy`
# -- switching to adaptive entropy below does NOT free this memory, the same
# full-vocab tensor gets computed either way. Don't raise this alongside the
# adaptive-entropy change; vary one axis at a time.
per_device_train_batch_size: 8
learning_rate: 2.0e-5
max_completion_length: 512
max_steps: 1000
gradient_checkpointing: true
log_every_n_steps: 10
# Checkpoint every 100 steps (was defaulting to trl's 500) so a re-run
# doesn't lose the pre-collapse window again -- runs/2026-09-19_23-22-12
# only saved checkpoint-500/1000, both already past the entropy collapse.
save_steps: 100
# Switched from a static entropy_coef=0.05 (runs/2026-09-21_16-34-13: entropy
# climbed monotonically to ~11.9 -- the vocab-size ceiling -- and pegged there
# for the last 750/1000 steps, 1 hack in 23,104 rollouts). A static bonus has
# no equilibrium below that ceiling once it dominates a near-zero policy
# gradient, and beta=0.005 was far too weak to resist a constant one-directional
# push. use_adaptive_entropy (trl's Skywork-OR1 implementation) only applies
# the bonus while entropy is at/below entropy_target, and decays entropy_coef
# back toward entropy_coef_min once entropy recovers -- closed-loop instead of
# open-loop, so it can't run away in either direction the way the static value
# did. entropy_coef itself is just the (adapted) starting point; see
# src/config.py's TrainingConfig for the full field-by-field reasoning,
# including why entropy_target=0.5 (not trl's default 0.2, which both runs so
# far show is "too late" for this environment).
entropy_coef: 0.0
use_adaptive_entropy: true
entropy_coef_min: 0.0
entropy_coef_max: 0.2
entropy_coef_delta: 0.005
entropy_target: 0.5
max_resample_attempts: 2
