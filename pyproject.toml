[project]
name = "reward-hacking-study"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Angel Patricio", email = "aopatric@mit.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "hydra-core>=1.3.7",
    "numpy>=2.4.6",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "wandb>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "gpu: requires a GPU / the real model; excluded from the default run",
]
addopts = "-m 'not gpu'"
